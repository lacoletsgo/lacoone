<head>
  <meta charset="UTF-8" />

  <style>
    /* Pretendard 폰트 */
    @import url('https://cdn.jsdelivr.net/npm/pretendard@1.3.6/dist/web/variable/pretendardvariable.css');

    :root {
      --accent-color: #4a90e2;
      --checkbox-size: 20px;
      --section-radius: 8px;
      --section-padding: 16px;
      --text-color: #333;
      --bg-page: #f5f7fa;
      --bg-section: #ffffff;
      --border-light: #e0e0e0;
    }

    body {
      background: var(--bg-page);
      font-family: 'Pretendard Variable', sans-serif;
      color: var(--text-color);
      margin: 0; padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-weight: 600;
      font-size: 1.8rem;
    }

    .section {
      background: var(--bg-section);
      border-radius: var(--section-radius);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin: 20px auto;
      max-width: 800px;
      overflow: hidden;
    }
    .section h2 {
      margin: 0;
      padding: var(--section-padding);
      display: flex; align-items: center;
      font-size: 1.2rem; font-weight: 500;
      background: #fafafa;
      border-bottom: 1px solid var(--border-light);
    }
    .section.main h2   { border-left: 6px solid #e74c3c; }
    .section.alt1 h2   { border-left: 6px solid #3498db; }
    .section.alt2 h2   { border-left: 6px solid #2ecc71; }
    .section.alt3 h2   { border-left: 6px solid #f1c40f; }

    .toggle-btn {
      margin-left: auto;
      background: none; border: none;
      font-size: 1.2rem; cursor: pointer;
      transition: transform 0.2s;
    }
    .toggle-btn:hover { transform: rotate(90deg); }
    .section-content.collapsed { display: none; }
    .section-content { padding: 0 var(--section-padding) var(--section-padding); }

    .subsection h3 {
      margin: var(--section-padding) 0 12px;
      font-size: 1rem; font-weight: 500;
      text-align: center;
    }
    .subsection.daily h3   { color: #d35400; }
    .subsection.weekly h3  { color: #2980b9; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0;
    }
    /* 줄무늬 */
    table tr:nth-child(even) { background: rgba(0,0,0,0.02); }
    td, th {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-light);
      white-space: nowrap;
      vertical-align: middle;
    }
    /* 첫 칸 볼드 + 들여쓰기 */
    td:first-child {
      font-weight: bold;
      padding-left: 20px;
      text-align: left;
    }
    /* 나머지 칸 flex 중앙 정렬 (주간 포함) */
    td:not(:first-child),
    th {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .checkbox {
      width: var(--checkbox-size);
      height: var(--checkbox-size);
      border: 2px solid var(--border-light);
      border-radius: 4px;
      background: #fff;
      position: relative;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin: 0 6px;
    }
    .checkbox:hover { border-color: var(--accent-color); }
    .checkbox.checked {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }
    .checkbox.checked::after {
      content: '✔';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px; color: #fff;
    }
    label {
      cursor: pointer; user-select: none;
      font-size: 0.95rem; color: var(--text-color);
      display: flex; align-items: center;
    }
    label:hover .checkbox { border-color: var(--accent-color); }
  </style>
</head>

  <script>
    function getCycleDate() {
      const now = new Date();
      if (now.getHours() < 6) now.setDate(now.getDate() - 1);
      return now.toISOString().slice(0,10);
    }
    function resetDaily() {
      const last = localStorage.getItem('lastResetDate');
      const today = getCycleDate();
      if (last !== today) {
        document.querySelectorAll('.checkbox[data-frequency="daily"]').forEach(cb=>{
          localStorage.removeItem(cb.id);
          cb.classList.remove('checked');
        });
        localStorage.setItem('lastResetDate', today);
      }
    }
    function restoreChecks() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        if (localStorage.getItem(cb.id) === 'true') {
          cb.classList.add('checked');
        }
      });
    }
    function bindCheckboxes() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        cb.addEventListener('click', () => {
          const group = cb.dataset.group;
          if (group) {
            const newState = !cb.classList.contains('checked');
            document.querySelectorAll(`.checkbox[data-group="${group}"]`)
              .forEach(other => {
                other.classList.toggle('checked', newState);
                localStorage.setItem(other.id, newState);
              });
          } else {
            cb.classList.toggle('checked');
            localStorage.setItem(cb.id, cb.classList.contains('checked'));
          }
        });
      });
    }
    function initToggles() {
      document.querySelectorAll('.section.alt1, .section.alt2, .section.alt3').forEach(sec=>{
        const secId = sec.id;
        const content = sec.querySelector('.section-content');
        const btn = sec.querySelector('.toggle-btn');
        let collapsed = localStorage.getItem('collapsed_'+secId);
        if (collapsed === null) {
          collapsed = true; // 기본 접힌 상태
        } else {
          collapsed = (collapsed === 'true');
        }
        if (collapsed) {
          content.classList.add('collapsed');
          btn.textContent = '▶';
        } else {
          content.classList.remove('collapsed');
          btn.textContent = '▼';
        }
        btn.addEventListener('click', () => {
          const nowCollapsed = content.classList.toggle('collapsed');
          btn.textContent = nowCollapsed ? '▶' : '▼';
          localStorage.setItem('collapsed_'+secId, nowCollapsed);
        });
      });
    }
    window.addEventListener('load', () => {
      resetDaily();
      restoreChecks();
      bindCheckboxes();
      initToggles();
    });
  </script>
