    /* Pretendard 폰트 */
    @import url('https://cdn.jsdelivr.net/npm/pretendard@1.3.6/dist/web/variable/pretendardvariable.css');
    body { font-family: 'Pretendard Variable', sans-serif; padding: 20px; }

    h1 { text-align: center; margin-bottom: 30px; }
    .section {
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      margin: 0 auto 20px;
      max-width: 800px;
    }
    .section.main  { background-color: #fff5f5; }
    .section.alt1  { background-color: #f5fff5; }
    .section.alt2  { background-color: #f5f5ff; }
    .section.alt3  { background-color: #fffaf0; }

    .section h2 {
      margin: 0; padding: 10px;
      font-size: 1.2em;
      display: flex; align-items: center;
      background: rgba(0,0,0,0.05);
    }
    .toggle-btn {
      margin-left: auto;
      background: none; border: none;
      font-size: 1.2em; cursor: pointer;
    }
    .section-content.collapsed { display: none; }

    .subsection h3 {
      margin: 0; padding: 6px;
      background: #fde9c3; font-size: 1em;
    }
    .subsection.weekly h3 {
      background: #ffdab9;
    }
    table {
      width: 100%; border-collapse: collapse;
      margin: 10px 0;
    }
    tr:nth-child(even) { background: rgba(0,0,0,0.02); }
    td, th {
      border: 1px solid #ccc;
      padding: 8px; text-align: center;
      white-space: nowrap;
    }

    .checkbox {
      display: inline-block;
      width: 18px; height: 18px;
      border: 1px solid #555;
      margin: 0 4px; vertical-align: middle;
      cursor: pointer; background: #fff;
      transition: background .2s;
    }
    .checkbox.checked { background: #e0e0e0; }
  </style>
</head>

  <script>
    // 1) 매일 06:00 기준 일일 초기화
    function getCycleDate() {
      const now = new Date();
      if (now.getHours() < 6) now.setDate(now.getDate() - 1);
      return now.toISOString().slice(0,10);
    }
    function resetDaily() {
      const last = localStorage.getItem('lastResetDate');
      const today = getCycleDate();
      if (last !== today) {
        document.querySelectorAll('.checkbox[data-frequency="daily"]').forEach(cb=>{
          localStorage.removeItem(cb.id);
          cb.classList.remove('checked');
        });
        localStorage.setItem('lastResetDate', today);
      }
    }

    // 2) 상태 복원
    function restore() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        if (localStorage.getItem(cb.id) === 'true') {
          cb.classList.add('checked');
        }
      });
    }

    // 3) 체크박스 바인딩 (동기화 지원)
    function bindCheckboxes() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        cb.addEventListener('click', () => {
          const group = cb.dataset.group;
          if (group) {
            const newState = !cb.classList.contains('checked');
            document.querySelectorAll(`.checkbox[data-group="${group}"]`)
              .forEach(other => {
                other.classList.toggle('checked', newState);
                localStorage.setItem(other.id, newState);
              });
          } else {
            cb.classList.toggle('checked');
            localStorage.setItem(cb.id, cb.classList.contains('checked'));
          }
        });
      });
    }

    // 4) 부 접기/펼치기
    function bindToggles() {
      document.querySelectorAll('.toggle-btn').forEach(btn=>{
        btn.addEventListener('click', () => {
          const content = btn.closest('.section').querySelector('.section-content');
          const collapsed = content.classList.toggle('collapsed');
          btn.textContent = collapsed ? '▶' : '▼';
        });
      });
    }

    window.addEventListener('load', () => {
      resetDaily();
      restore();
      bindCheckboxes();
      bindToggles();
    });
  </script>
