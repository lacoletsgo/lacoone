<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>모비노기 체크리스트</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .section {
      border: 1px solid #ddd;
      margin: 0 auto 20px;
      border-radius: 4px;
      overflow: hidden;
      max-width: 800px;
    }
    .section h2 {
      margin: 0;
      padding: 10px;
      background: #f5f0e1;
      font-size: 1.2em;
    }
    .subsection h3 {
      margin: 0;
      padding: 6px;
      background: #fde9c3;
      font-size: 1em;
    }
    .subsection.weekly h3 {
      background: #ffdab9;
    }
    table {
      margin: 0 auto;
      width: auto;
      table-layout: fixed;
      border-collapse: collapse;
    }
    td, th {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
      white-space: nowrap;
    }
    .checkbox {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 1px solid #555;
      margin: 0 4px;
      vertical-align: middle;
      cursor: pointer;
      background: #fff;
    }
    .checkbox.checked {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <h1>도전 체크리스트</h1>

  <!-- 본 (main) 섹션 -->
  <div class="section" id="main-section">
    <h2>본</h2>
    <div class="subsection daily">
      <h3>일일도전</h3>
      <table>
        <tr>
          <td>무료 패션 리롤</td>
          <td><span class="checkbox" id="main_freeFashion_1" data-frequency="daily"></span></td>
        </tr>
        <tr>
          <td>검은 구멍</td>
          <td><span class="checkbox" id="main_blackHole_1" data-frequency="daily"></span></td>
          <td><span class="checkbox" id="main_blackHole_2" data-frequency="daily"></span></td>
          <td><span class="checkbox" id="main_blackHole_3" data-frequency="daily"></span></td>
        </tr>
        <tr>
          <td>결계</td>
          <td><span class="checkbox" id="main_barrier_1" data-frequency="daily"></span></td>
          <td><span class="checkbox" id="main_barrier_2" data-frequency="daily"></span></td>
        </tr>
        <tr>
          <td>요일 던전</td>
          <td><span class="checkbox" id="main_dayDungeon_1" data-frequency="daily"></span></td>
        </tr>
      </table>
    </div>
    <div class="subsection weekly">
      <h3>주간 도전</h3>
      <table>
        <tr>
          <td>멤버쉽 골드알바</td>
          <td><span class="checkbox" id="main_goldAlba" data-frequency="weekly"></span></td>
        </tr>
        <tr>
          <td>필보</td>
          <td>
            <label><span class="checkbox" id="main_filbo_ferry" data-frequency="weekly"></span>페리</label>
            <label><span class="checkbox" id="main_filbo_kravbakh" data-frequency="weekly"></span>크라브바흐</label>
            <label><span class="checkbox" id="main_filbo_krama" data-frequency="weekly"></span>크라마</label>
          </td>
        </tr>
        <tr>
          <td>마물퇴치징표</td>
          <td>룬의 파편 · 강화 재연소 촉매</td>
        </tr>
        <tr>
          <td>어비스</td>
          <td>유적 · 제단 · 전당</td>
        </tr>
        <tr>
          <td>레이드</td>
          <td>입문 · 지옥</td>
        </tr>
      </table>
    </div>
  </div>

  <!-- 부 (alt) 섹션 예시: 필요한 만큼 복제하세요 -->
  <div class="section">
    <h2>부</h2>
    <div class="subsection daily">
      <h3>일일도전</h3>
      <table>
        <tr>
          <td>무료 패션 리롤</td>
          <td><span class="checkbox" id="alt1_freeFashion_1" data-frequency="daily"></span></td>
        </tr>
        <tr>
          <td>검은 구멍</td>
          <td><span class="checkbox" id="alt1_blackHole_1" data-frequency="daily"></span></td>
          <td><span class="checkbox" id="alt1_blackHole_2" data-frequency="daily"></span></td>
          <td><span class="checkbox" id="alt1_blackHole_3" data-frequency="daily"></span></td>
        </tr>
        <tr>
          <td>결계</td>
          <td><span class="checkbox" id="alt1_barrier_1" data-frequency="daily"></span></td>
          <td><span class="checkbox" id="alt1_barrier_2" data-frequency="daily"></span></td>
        </tr>
        <tr>
          <td>요일 던전</td>
          <td><span class="checkbox" id="alt1_dayDungeon_1" data-frequency="daily"></span></td>
        </tr>
      </table>
    </div>
    <div class="subsection weekly">
      <h3>주간 도전</h3>
      <table>
        <tr>
          <td>멤버쉽 골드알바</td>
          <td><span class="checkbox" id="alt1_goldAlba" data-frequency="weekly"></span></td>
        </tr>
        <tr>
          <td>필보</td>
          <td>
            <label><span class="checkbox" id="alt1_filbo_ferry" data-frequency="weekly"></span>페리</label>
            <label><span class="checkbox" id="alt1_filbo_kravbakh" data-frequency="weekly"></span>크라브바흐</label>
            <label><span class="checkbox" id="alt1_filbo_krama" data-frequency="weekly"></span>크라마</label>
          </td>
        </tr>
        <tr>
          <td>마물퇴치징표</td>
          <td>룬의 파편 · 강화 재연소 촉매</td>
        </tr>
        <tr>
          <td>어비스</td>
          <td>유적 · 제단 · 전당</td>
        </tr>
        <tr>
          <td>레이드</td>
          <td>입문 · 지옥</td>
        </tr>
      </table>
    </div>
  </div>

  <script>
    // 매일 새벽 6시 기준으로 daily 초기화
    function getCycleDate() {
      const now = new Date();
      if (now.getHours() < 6) now.setDate(now.getDate() - 1);
      return now.toISOString().slice(0,10);
    }
    function resetDaily() {
      const last = localStorage.getItem('lastResetDate');
      const today = getCycleDate();
      if (last !== today) {
        document.querySelectorAll('.checkbox[data-frequency="daily"]').forEach(cb=>{
          localStorage.removeItem(cb.id);
        });
        localStorage.setItem('lastResetDate', today);
      }
    }
    function restore() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        if (localStorage.getItem(cb.id) === 'true') {
          cb.classList.add('checked');
        }
      });
    }
    function bind() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        cb.addEventListener('click', ()=>{
          cb.classList.toggle('checked');
          localStorage.setItem(cb.id, cb.classList.contains('checked'));
        });
      });
    }
    window.addEventListener('load', ()=>{
      resetDaily();
      restore();
      bind();
    });
  </script>
</body>
</html>
