<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>도전 체크리스트</title>
  <style>
    /* Pretendard 폰트 */
    @import url('https://cdn.jsdelivr.net/npm/pretendard@1.3.6/dist/web/variable/pretendardvariable.css');
    body {
      font-family: 'Pretendard Variable', sans-serif;
      background: #fafafa;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      color: #222;
    }
    .section {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin: 0 auto 20px;
      max-width: 800px;
      overflow: hidden;
    }
    /* 헤더(h2)에만 파스텔 톤 컬러 */
    .section.main h2 { background-color: #ffe5e5; }
    .section.alt1 h2 { background-color: #e5ffe5; }
    .section.alt2 h2 { background-color: #e5e5ff; }
    .section.alt3 h2 { background-color: #fffbe5; }

    .section h2 {
      display: flex;
      align-items: center;
      margin: 0;
      padding: 12px 16px;
      font-size: 1.2em;
      border-bottom: 2px solid #ddd;
      color: #222;
    }
    .toggle-btn {
      margin-left: auto;
      background: none;
      border: none;
      font-size: 1.2em;
      cursor: pointer;
      color: #666;
      transition: color .2s;
    }
    .toggle-btn:hover {
      color: #333;
    }
    .section-content.collapsed { display: none; }

    .subsection h3 {
      margin: 16px;
      padding: 4px 8px;
      font-size: 1em;
      font-weight: 500;
      color: #444;
    }
    .subsection.weekly h3 {
      color: #444;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 16px 16px;
    }
    tr + tr td {
      border-top: 1px solid #eee;
    }
    td:first-child {
      font-weight: 600;
      text-align: left;
      padding: 12px 8px;
      width: 30%;
    }
    td {
      padding: 12px 8px;
      text-align: center;
      vertical-align: middle;
      font-size: 0.95em;
    }

    /* 커스텀 체크박스 */
    .checkbox {
      position: relative;
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      vertical-align: middle;
      transition: border-color .2s, background-color .2s;
    }
    .checkbox:hover {
      border-color: #888;
    }
    .checkbox.checked {
      background-color: #4caf50;
      border-color: #4caf50;
    }
    .checkbox.checked::after {
      content: '✓';
      position: absolute;
      top: 1px; left: 4px;
      font-size: 14px;
      color: #fff;
    }
    label {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      margin-right: 8px;
      user-select: none;
      color: #333;
      font-size: 0.95em;
    }
    label > .checkbox {
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <h1>도전 체크리스트</h1>

  <!-- 본 섹션 -->
  <div class="section main" id="main-section">
    <h2>본</h2>
    <div class="section-content">
      <div class="subsection daily">
        <h3>일일 도전</h3>
        <table>
          <tr>
            <td>무료 패션 리롤</td>
            <td>
              <span class="checkbox"
                    id="main_freeFashion"
                    data-frequency="daily"
                    data-group="freeFashion"></span>
            </td>
          </tr>
          <tr>
            <td>검은 구멍</td>
            <td><span class="checkbox" id="main_blackHole_1" data-frequency="daily"></span></td>
            <td><span class="checkbox" id="main_blackHole_2" data-frequency="daily"></span></td>
            <td><span class="checkbox" id="main_blackHole_3" data-frequency="daily"></span></td>
          </tr>
          <tr>
            <td>결계</td>
            <td><span class="checkbox" id="main_barrier_1" data-frequency="daily"></span></td>
            <td><span class="checkbox" id="main_barrier_2" data-frequency="daily"></span></td>
          </tr>
          <tr>
            <td>요일 던전</td>
            <td><span class="checkbox" id="main_dayDungeon_1" data-frequency="daily"></span></td>
          </tr>
        </table>
      </div>
      <div class="subsection weekly">
        <h3>주간 도전</h3>
        <table>
          <tr>
            <td>멤버십 골드알바</td>
            <td><span class="checkbox" id="main_goldAlba" data-frequency="weekly"></span></td>
          </tr>
          <tr>
            <td>필보</td>
            <td>
              <label><span class="checkbox" id="main_filbo_ferry" data-frequency="weekly"></span>페리</label>
              <label><span class="checkbox" id="main_filbo_kravbakh" data-frequency="weekly"></span>크라브바흐</label>
              <label><span class="checkbox" id="main_filbo_krama" data-frequency="weekly"></span>크라마</label>
            </td>
          </tr>
          <tr>
            <td>마물 퇴치 징표</td>
            <td>
              <label><span class="checkbox" id="main_monsterRune" data-frequency="weekly" data-group="monsterRune"></span>룬의 파편</label>
              <label><span class="checkbox" id="main_monsterCatalyst" data-frequency="weekly" data-group="monsterCatalyst"></span>강화 재연소 촉매</label>
            </td>
          </tr>
          <tr>
            <td>어비스</td>
            <td>
              <label><span class="checkbox" id="main_abyss_relic" data-frequency="weekly"></span>유적</label>
              <label><span class="checkbox" id="main_abyss_altar" data-frequency="weekly"></span>제단</label>
              <label><span class="checkbox" id="main_abyss_hall" data-frequency="weekly"></span>전당</label>
            </td>
          </tr>
          <tr>
            <td>레이드</td>
            <td>
              <label><span class="checkbox" id="main_raid_beginner" data-frequency="weekly"></span>입문</label>
              <label><span class="checkbox" id="main_raid_hell" data-frequency="weekly"></span>지옥</label>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>

            <td><span class="checkbox" id="alt1_blackHole_2" data-frequency="daily"></span></td>
            <td><span class="checkbox" id="alt1_blackHole_3" data-frequency="daily"></span></td>
          </tr>
          <tr>

      <div class="subsection weekly">
        <h3>주간 도전</h3>
        <table>
          <tr>

            <td><span class="checkbox" id="alt1_goldAlba" data-frequency="weekly"></span></td>
          </tr>
          <tr>
            <td>필보</td>
            <td>
              <label><span class="checkbox" id="alt1_filbo_ferry" data-frequency="weekly"></span>페리</label>
              <label><span class="checkbox" id="alt1_filbo_kravbakh" data-frequency="weekly"></span>크라브바흐</label>
              <label><span class="checkbox" id="alt1_filbo_krama" data-frequency="weekly"></span>크라마</label>
            </td>
          </tr>
          <tr>

              <label><span class="checkbox" id="alt1_monsterCatalyst" data-frequency="weekly" data-group="monsterCatalyst"></span>강화 재연소 촉매</label>
            </td>
          </tr>
          <tr>
            <td>어비스</td>
            <td>

  <!-- 부2 섹션 -->

    <h2>

    </h2>
    <div class="section-content">
      <!-- 본과 똑같은 구조(alt2_로 id만 변경) -->
      <div class="subsection daily">
        <h3>일일 도전</h3>
        <table>
          <!-- … 동일하게 복사 … -->
        </table>
      </div>
      <div class="subsection weekly">
        <h3>주간 도전</h3>
        <table>

        </table>
      </div>
    </div>
  </div>

  <!-- 부3 섹션 -->
  <div class="section alt3" id="alt3-section">
    <h2>
      부 3

    </h2>
    <div class="section-content">
      <!-- 본과 똑같은 구조(alt3_로 id만 변경) -->
      <div class="subsection daily">
        <h3>일일 도전</h3>
        <table>
          <!-- … 동일하게 복사 … -->
        </table>
      </div>
      <div class="subsection weekly">

        <table>
          <!-- … 동일하게 복사 … -->
        </table>
      </div>
    </div>
  </div>

  <script>
    // 1) 매일 06:00 기준 일일 초기화
    function getCycleDate() {
      const now = new Date();
      if (now.getHours() < 6) now.setDate(now.getDate() - 1);
      return now.toISOString().slice(0,10);
    }
    function resetDaily() {
      const last = localStorage.getItem('lastResetDate');
      const today = getCycleDate();
      if (last !== today) {
        document.querySelectorAll('.checkbox[data-frequency="daily"]').forEach(cb=>{
          localStorage.removeItem(cb.id);
          cb.classList.remove('checked');
        });
        localStorage.setItem('lastResetDate', today);
      }
    }

    // 2) 저장된 상태 복원
    function restore() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        if (localStorage.getItem(cb.id) === 'true') {
          cb.classList.add('checked');
        }
      });
    }

    // 3) 체크박스 클릭 바인딩 (동기화 지원)
    function bindCheckboxes() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        cb.addEventListener('click', () => {
          const group = cb.dataset.group;
          if (group) {
            const newState = !cb.classList.contains('checked');
            document.querySelectorAll(`.checkbox[data-group="${group}"]`)
              .forEach(other => {
                other.classList.toggle('checked', newState);
                localStorage.setItem(other.id, newState);
              });
          } else {
            cb.classList.toggle('checked');
            localStorage.setItem(cb.id, cb.classList.contains('checked'));
          }
        });
      });
    }

    // 4) 부 접기/펼치기
    function bindToggles() {
      document.querySelectorAll('.toggle-btn').forEach(btn=>{
        btn.addEventListener('click', () => {
          const content = btn.closest('.section').querySelector('.section-content');
          const collapsed = content.classList.toggle('collapsed');
          btn.textContent = collapsed ? '▶' : '▼';
        });
      });
    }

    window.addEventListener('load', () => {
      resetDaily();
      restore();
      bindCheckboxes();
      bindToggles();
    });
  </script>
</body>
</html>
