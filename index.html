<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>체크리스트</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-6">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow">
    <h1 class="text-2xl font-bold mb-4">체크리스트</h1>
    <div class="flex space-x-4 mb-6">
      <input type="text" id="name-0" placeholder="본캐" class="flex-1 border rounded px-3 py-2"/>
      <input type="text" id="name-1" placeholder="부캐1" class="flex-1 border rounded px-3 py-2"/>
      <input type="text" id="name-2" placeholder="부캐2" class="flex-1 border rounded px-3 py-2"/>
      <input type="text" id="name-3" placeholder="부캐3" class="flex-1 border rounded px-3 py-2"/>
    </div>
    <table class="min-w-full table-auto border-collapse">
      <thead>
        <tr class="bg-gray-200">
          <th class="border px-4 py-2">항목</th>
          <th class="border px-4 py-2" id="th-0"></th>
          <th class="border px-4 py-2" id="th-1"></th>
          <th class="border px-4 py-2" id="th-2"></th>
          <th class="border px-4 py-2" id="th-3"></th>
        </tr>
      </thead>
      <tbody>
        <!-- Daily challenge per char -->
        <tr>
          <td class="border px-4 py-2">일일 도전</td>
          <td class="border px-4 py-2 text-center"><input type="checkbox" id="daily-0"/></td>
          <td class="border px-4 py-2 text-center"><input type="checkbox" id="daily-1"/></td>
          <td class="border px-4 py-2 text-center"><input type="checkbox" id="daily-2"/></td>
          <td class="border px-4 py-2 text-center"><input type="checkbox" id="daily-3"/></td>
        </tr>
        <!-- Shared daily tasks -->
        <tr>
          <td class="border px-4 py-2" colspan="5">
            <div class="flex items-center">
              <input type="checkbox" id="cashshop" class="mr-2"/>
              캐시샵 무료 리롤 (공유)
            </div>
          </td>
        </tr>
        <tr>
          <td class="border px-4 py-2" colspan="5">
            <div class="flex items-center">
              <input type="checkbox" id="blackhole" class="mr-2"/>
              검은 구멍
            </div>
          </td>
        </tr>
        <tr>
          <td class="border px-4 py-2" colspan="5">
            <div class="flex items-center">
              <input type="checkbox" id="barrier" class="mr-2"/>
              결계
            </div>
          </td>
        </tr>
        <tr>
          <td class="border px-4 py-2" colspan="5">
            <div class="flex items-center">
              <input type="checkbox" id="dayDungeon" class="mr-2"/>
              요일 던전 (<span id="dayInfo"></span>)
            </div>
          </td>
        </tr>
        <!-- Weekly tasks group header -->
        <tr class="bg-gray-200">
          <td class="border px-4 py-2 font-bold">주간 도전</td>
          <td class="border px-4 py-2"></td>
          <td class="border px-4 py-2"></td>
          <td class="border px-4 py-2"></td>
          <td class="border px-4 py-2"></td>
        </tr>
        <!-- Weekly tasks -->
        <tr>
          <td class="border px-4 py-2" colspan="5">
            <div class="flex flex-wrap gap-4">
              <label><input type="checkbox" id="membership" class="mr-1"/> 멤버쉽 아르바이트(골드)</label>
              <label><input type="checkbox" id="peri" class="mr-1"/> 필드보스 페리</label>
              <label><input type="checkbox" id="krav" class="mr-1"/> 필드보스 크라브바흐</label>
              <label><input type="checkbox" id="krama" class="mr-1"/> 필드보스 크라마</label>
              <label><input type="checkbox" id="sharedItems" class="mr-1"/> 마물 퇴치 증표/룬의파편/강화 재연소 촉매 (공유)</label>
              <label><input type="checkbox" id="abyss" class="mr-1"/> 어비스 유적</label>
              <label><input type="checkbox" id="altar" class="mr-1"/> 제단</label>
              <label><input type="checkbox" id="hall" class="mr-1"/> 전당</label>
            </div>
          </td>
        </tr>
        <!-- Raid radio -->
        <tr>
          <td class="border px-4 py-2">레이드 (택1)</td>
          <td colspan="4" class="border px-4 py-2">
            <div class="flex gap-4">
              <label><input type="radio" name="raid" value="glass" class="mr-1"/> 글라스기브넨 입문</label>
              <label><input type="radio" name="raid" value="hell" class="mr-1"/> 글라스기브넨 지옥</label>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Character name inputs and table headers
    const nameIds = ["name-0","name-1","name-2","name-3"];
    const thIds = ["th-0","th-1","th-2","th-3"];
    const defaultNames = ["본캐","부캐1","부캐2","부캐3"];
    // Task IDs
    const dailyIds = ["daily-0","daily-1","daily-2","daily-3","cashshop","blackhole","barrier","dayDungeon"];
    const weeklyIds = ["membership","peri","krav","krama","sharedItems","abyss","altar","hall"];
    const allIds = [...dailyIds,...weeklyIds];

    // Load saved names
    let names = JSON.parse(localStorage.getItem("names")||"[]");
    if(names.length!==4) names = [...defaultNames];
    // Apply names to inputs and headers
    nameIds.forEach((id,i)=>{
      const input=document.getElementById(id);
      input.value=names[i];
      document.getElementById(thIds[i]).innerText=names[i];
      input.addEventListener("input",()=>{
        names[i]=input.value||defaultNames[i];
        document.getElementById(thIds[i]).innerText=names[i];
        localStorage.setItem("names",JSON.stringify(names));
      });
    });

    // Dungeon day info
    const dayNames=["일","월","화","수","목","금","토"];
    const dungeonMap={0:"원하는 던전",1:"골드",2:"보석",3:"촉매",4:"골드",5:"보석",6:"촉매"};
    document.getElementById("dayInfo").innerText=`${dayNames[new Date().getDay()]}요일: ${dungeonMap[new Date().getDay()]}`;

    // Load or initialize checklist data
    let data = JSON.parse(localStorage.getItem("checklist")||"{}");
    const now=new Date();
    // Reset daily at 6:00
    const dailyPoint=new Date(now.getFullYear(), now.getMonth(), now.getDate(),6);
    const lastDailyReset=localStorage.getItem("lastDailyReset");
    if(!lastDailyReset|| new Date(lastDailyReset) < dailyPoint && now>=dailyPoint){
      dailyIds.forEach(id=>data[id]=false);
      localStorage.setItem("lastDailyReset", now.toISOString());
    }
    // Reset weekly on Monday 6:00
    const weekDay = now.getDay(), //0 sunday
          diff=(weekDay+6)%7,
          mon=new Date(now);
    mon.setDate(now.getDate()-diff);
    const weeklyPoint=new Date(mon.getFullYear(), mon.getMonth(), mon.getDate(),6);
    const lastWeeklyReset=localStorage.getItem("lastWeeklyReset");
    if(!lastWeeklyReset|| new Date(lastWeeklyReset) < weeklyPoint && now>=weeklyPoint){
      weeklyIds.forEach(id=>data[id]=false);
      data["raid"]=null;
      localStorage.setItem("lastWeeklyReset", now.toISOString());
    }

    // Apply saved values
    allIds.forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.checked=!!data[id];
    });
    document.getElementsByName("raid").forEach(r=>{ r.checked = data["raid"]===r.value; });

    // Save on change
    const saveData=()=>{
      localStorage.setItem("checklist",JSON.stringify(data));
    };
    allIds.forEach(id=>{
      const el=document.getElementById(id);
      if(el){
        el.addEventListener("change",()=>{
          data[id]=el.checked;
          saveData();
        });
      }
    });
    document.getElementsByName("raid").forEach(r=>{
      r.addEventListener("change",()=>{
        data["raid"]=r.value;
        saveData();
      });
    });
  </script>
</body>
</html>
