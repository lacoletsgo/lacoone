<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Daily Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>매일 일일 도전 체크리스트</h1>

  <section class="section">
    <h2>본 • 일일 도전</h2>
    <ul>
      <li>
        <label>
          <input type="checkbox" id="daily-fashion" />
          <span>무료 패션 리롤</span>
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" id="daily-hole" />
          <span>검은 구멍</span>
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" id="daily-barrier" />
          <span>결계</span>
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" id="daily-dungeon" />
          <span>요일 던전</span>
        </label>
      </li>
    </ul>
  </section>

  <section class="section">
    <h2>부 • 일일 도전</h2>
    <ul>
      <li>
        <label>
          <input type="checkbox" id="daily-fashion-2" />
          <span>무료 패션 리롤</span>
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" id="daily-hole-2" />
          <span>검은 구멍</span>
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" id="daily-barrier-2" />
          <span>결계</span>
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" id="daily-dungeon-2" />
          <span>요일 던전</span>
        </label>
      </li>
    </ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
