<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>모비노기 체크리스트</title>
  <style>
    @import url('https://cdn.jsdelivr.net/npm/pretendard@1.3.6/dist/web/variable/pretendardvariable.css');
    :root {
      --accent: #4a90e2;
      --size: 20px;
      --pad: 16px;
      --text: #333;
      --bg-page: #f5f7fa;
      --bg-sec: #fff;
      --border: #e0e0e0;
    }
    body {
      background: var(--bg-page);
      font-family: 'Pretendard Variable', sans-serif;
      color: var(--text);
      margin:0; padding:20px;
    }
    h1 {
      text-align:center;
      margin-bottom:24px;
      font-size:1.8rem;
      font-weight:600;
    }
    .section {
      background:var(--bg-sec);
      border-radius:8px;
      box-shadow:0 2px 8px rgba(0,0,0,0.06);
      margin:20px auto;
      max-width:800px;
      overflow:hidden;
    }
    .section h2 {
      margin:0; padding:var(--pad);
      display:flex; align-items:center;
      font-size:1.2rem; font-weight:500;
      background:#fafafa;
      border-bottom:1px solid var(--border);
    }
    .section.main h2  { border-left:6px solid #e74c3c; }
    .section.alt1 h2  { border-left:6px solid #3498db; }
    .section.alt2 h2  { border-left:6px solid #2ecc71; }
    .section.alt3 h2  { border-left:6px solid #f1c40f; }
    .toggle-btn {
      margin-left:auto; background:none; border:none;
      font-size:1.2rem; cursor:pointer; transition:transform .2s;
    }
    .toggle-btn:hover { transform:rotate(90deg); }
    .section-content { padding:0 var(--pad) var(--pad); }
    .section-content.collapsed { display:none; }

    .subsection h3 {
      margin:var(--pad) 0 12px;
      font-size:1rem; font-weight:500;
      text-align:center;
    }
    .subsection.daily h3  { color:#d35400; }
    .subsection.weekly h3 { color:#2980b9; }

    table {
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
    }
    table colgroup col:nth-child(1) { width:40%; }
    table colgroup col:nth-child(n+2) { width:20%; }
    tr:nth-child(even) { background:rgba(0,0,0,0.02); }
    td, th {
      padding:12px 10px;
      border-bottom:1px solid var(--border);
      vertical-align:middle;
      white-space:nowrap;
    }
    td:first-child {
      font-weight:bold;
      padding-left:20px;
      text-align:left;
    }
    /* 체크박스+텍스트를 수평·수직 중앙 정렬 */
    td:not(:first-child) {
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
    }

    .checkbox {
      width:var(--size); height:var(--size);
      border:2px solid var(--border);
      border-radius:4px;
      background:#fff;
      position:relative;
      cursor:pointer;
      transition:border-color .2s, background .2s;
      display:inline-block;
      vertical-align:middle;
    }
    .checkbox:hover { border-color:var(--accent); }
    .checkbox.checked {
      background:var(--accent);
      border-color:var(--accent);
    }
    .checkbox.checked::after {
      content:'✔';
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      font-size:14px; color:#fff;
    }
  </style>
</head>
<body>
  <h1>모비노기 체크리스트</h1>

  <!-- 본 섹션 -->
  <div class="section main" id="main">
    <h2>본</h2>
    <div class="section-content">
      <!-- 일일도전 -->
      <div class="subsection daily">
        <h3>일일도전</h3>
        <table>
          <colgroup><col/><col/><col/><col/></colgroup>
          <tr>
            <td>무료 패션 리롤</td>
            <td><span class="checkbox" id="main_freeFashion" data-frequency="daily" data-group="freeFashion"></span></td>
            <td></td><td></td>
          </tr>
          <tr>
            <td>검은 구멍</td>
            <td><span class="checkbox" id="main_blackHole_1" data-frequency="daily"></span></td>
            <td><span class="checkbox" id="main_blackHole_2" data-frequency="daily"></span></td>
            <td><span class="checkbox" id="main_blackHole_3" data-frequency="daily"></span></td>
          </tr>
          <tr>
            <td>결계</td>
            <td><span class="checkbox" id="main_barrier_1" data-frequency="daily"></span></td>
            <td><span class="checkbox" id="main_barrier_2" data-frequency="daily"></span></td>
            <td></td>
          </tr>
          <tr>
            <td>요일 던전</td>
            <td><span class="checkbox" id="main_dayDungeon_1" data-frequency="daily"></span></td>
            <td></td><td></td>
          </tr>
        </table>
      </div>
      <!-- 주간도전 -->
      <div class="subsection weekly">
        <h3>주간도전</h3>
        <table>
          <colgroup><col/><col/><col/><col/></colgroup>
          <tr>
            <td>멤버쉽 골드알바</td>
            <td><span class="checkbox" id="main_goldAlba" data-frequency="weekly"></span></td>
            <td></td><td></td>
          </tr>
          <tr>
            <td>필보</td>
            <td><span class="checkbox" id="main_filbo_ferry" data-frequency="weekly"></span>페리</td>
            <td><span class="checkbox" id="main_filbo_kravbakh" data-frequency="weekly"></span>크라브바흐</td>
            <td><span class="checkbox" id="main_filbo_krama" data-frequency="weekly"></span>크라마</td>
          </tr>
          <tr>
            <td>마물퇴치징표</td>
            <td><span class="checkbox" id="main_monsterRune" data-frequency="weekly" data-group="monsterRune"></span>룬의 파편</td>
            <td><span class="checkbox" id="main_monsterCatalyst" data-frequency="weekly" data-group="monsterCatalyst"></span>강화 재연소 촉매</td>
            <td></td>
          </tr>
          <tr>
            <td>어비스</td>
            <td><span class="checkbox" id="main_abyss_relic" data-frequency="weekly"></span>유적</td>
            <td><span class="checkbox" id="main_abyss_altar" data-frequency="weekly"></span>제단</td>
            <td><span class="checkbox" id="main_abyss_hall" data-frequency="weekly"></span>전당</td>
          </tr>
          <tr>
            <td>레이드</td>
            <td><span class="checkbox" id="main_raid_beginner" data-frequency="weekly"></span>입문</td>
            <td><span class="checkbox" id="main_raid_hell" data-frequency="weekly"></span>지옥</td>
            <td></td>
          </tr>
        </table>
      </div>
    </div>
  </div>

  <!-- 부1 섹션 -->
  <div class="section alt1" id="alt1">
    <h2>부 1 <button class="toggle-btn">▶</button></h2>
    <div class="section-content collapsed">
      <!-- ...일일/주간 동일 구조 반복... -->
    </div>
  </div>

  <!-- 부2 섹션 -->
  <div class="section alt2" id="alt2">
    <h2>부 2 <button class="toggle-btn">▶</button></h2>
    <div class="section-content collapsed">
      <!-- ...반복... -->
    </div>
  </div>

  <!-- 부3 섹션 -->
  <div class="section alt3" id="alt3">
    <h2>부 3 <button class="toggle-btn">▶</button></h2>
    <div class="section-content collapsed">
      <!-- ...반복... -->
    </div>
  </div>

  <script>
    // 일일 초기화: 매일 06:00 기준
    function getDailyCycle() {
      const now = new Date();
      if (now.getHours() < 6) now.setDate(now.getDate() - 1);
      return now.toISOString().slice(0,10);
    }
    function resetDaily() {
      const last = localStorage.getItem('lastDailyReset'),
            today = getDailyCycle();
      if (last !== today) {
        document.querySelectorAll('.checkbox[data-frequency="daily"]').forEach(cb=>{
          localStorage.removeItem(cb.id);
          cb.classList.remove('checked');
        });
        localStorage.setItem('lastDailyReset', today);
      }
    }

    // 주간 초기화: 매주 월요일 06:00 KST 기준
    function getWeeklyCycle() {
      const now = new Date();
      // JS 로컬은 KST, 일요일=0, 월요일=1
      const dow = now.getDay();
      const diff = dow === 0 ? -6 : 1 - dow;
      const mon = new Date(now);
      mon.setDate(now.getDate() + diff);
      mon.setHours(6,0,0,0);
      return mon.getTime();
    }
    function resetWeekly() {
      const last = parseInt(localStorage.getItem('lastWeeklyReset')||'0',10);
      const thisMon = getWeeklyCycle();
      if (Date.now() >= thisMon && last < thisMon) {
        document.querySelectorAll('.checkbox[data-frequency="weekly"]').forEach(cb=>{
          localStorage.removeItem(cb.id);
          cb.classList.remove('checked');
        });
        localStorage.setItem('lastWeeklyReset', thisMon);
      }
    }

    // 저장된 체크 복원 및 클릭바인딩
    function restoreAndBind() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        if (localStorage.getItem(cb.id)==='true') cb.classList.add('checked');
        cb.addEventListener('click', ()=>{
          const grp = cb.dataset.group;
          if (grp) {
            const st = !cb.classList.contains('checked');
            document.querySelectorAll(`.checkbox[data-group="${grp}"]`)
              .forEach(o=>{ o.classList.toggle('checked', st); localStorage.setItem(o.id, st); });
          } else {
            cb.classList.toggle('checked');
            localStorage.setItem(cb.id, cb.classList.contains('checked'));
          }
        });
      });
    }

    // 부 섹션 토글 (상태 저장)
    function initToggles() {
      ['alt1','alt2','alt3'].forEach(id=>{
        const sec = document.getElementById(id),
              ct = sec.querySelector('.section-content'),
              btn= sec.querySelector('.toggle-btn'),
              key = 'collapsed_'+id;
        let col = localStorage.getItem(key);
        col = col===null ? true : (col==='true');
        ct.classList.toggle('collapsed', col);
        btn.textContent = col ? '▶' : '▼';
        btn.addEventListener('click', ()=>{
          const now = !ct.classList.toggle('collapsed');
          btn.textContent = now ? '▶' : '▼';
          localStorage.setItem(key, !now);
        });
      });
    }

    window.addEventListener('load', ()=>{
      resetDaily();
      resetWeekly();
      restoreAndBind();
      initToggles();
    });
  </script>
</body>
</html>
