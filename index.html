<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>모비노기 체크리스트</title>
  <style>
    @import url('https://cdn.jsdelivr.net/npm/pretendard@1.3.6/dist/web/variable/pretendardvariable.css');

    :root {
      --accent: #4a90e2;
      --size: 20px;
      --pad: 16px;
      --text: #333;
      --bg-page: #f5f7fa;
      --bg-sec: #fff;
      --border: #e0e0e0;
    }

    body {
      background: var(--bg-page);
      font-family: 'Pretendard Variable', sans-serif;
      color: var(--text);
      margin: 0; padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.8rem;
      font-weight: 600;
    }

    .section {
      background: var(--bg-sec);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin: 20px auto;
      max-width: 800px;
      overflow: hidden;
    }
    .section h2 {
      margin: 0; padding: var(--pad);
      display: flex; align-items: center;
      font-size: 1.2rem; font-weight: 500;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
    }
    .section.main h2  { border-left: 6px solid #e74c3c; }
    .section.alt1 h2  { border-left: 6px solid #3498db; }
    .section.alt2 h2  { border-left: 6px solid #2ecc71; }
    .section.alt3 h2  { border-left: 6px solid #f1c40f; }

    .toggle-btn {
      margin-left: auto; background: none; border: none;
      font-size: 1.2rem; cursor: pointer; transition: transform .2s;
    }
    .toggle-btn:hover { transform: rotate(90deg); }
    .section-content { padding: 0 var(--pad) var(--pad); }
    .section-content.collapsed { display: none; }

    .subsection h3 {
      margin: var(--pad) 0 12px;
      font-size: 1rem; font-weight: 500;
      text-align: center;
    }
    .subsection.daily h3  { color: #d35400; }
    .subsection.weekly h3 { color: #2980b9; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0;
      table-layout: fixed;
    }
    /* 고정 열 너비: 1열 40%, 나머지 3열 20% */
    table colgroup col:nth-child(1) { width: 40%; }
    table colgroup col:nth-child(n+2) { width: 20%; }

    tr:nth-child(even) { background: rgba(0,0,0,0.02); }
    td, th {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      white-space: nowrap;
    }
    td:first-child {
      font-weight: bold;
      padding-left: 20px;
      text-align: left;
    }
    td:not(:first-child), th {
      text-align: center;
    }

    .checkbox {
      width: var(--size); height: var(--size);
      border: 2px solid var(--border);
      border-radius: 4px;
      background: #fff;
      position: relative;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      display: inline-block;
    }
    .checkbox:hover { border-color: var(--accent); }
    .checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .checkbox.checked::after {
      content: '✔';
      position: absolute; top:50%; left:50%;
      transform: translate(-50%,-50%);
      font-size: 14px; color: #fff;
    }
  </style>
</head>

  <script>
    function getCycleDate() {
      const now = new Date();
      if (now.getHours() < 6) now.setDate(now.getDate()-1);
      return now.toISOString().slice(0,10);
    }
    function resetDaily() {
      const last = localStorage.getItem('lastResetDate'),
            today = getCycleDate();
      if (last !== today) {
        document.querySelectorAll('.checkbox[data-frequency="daily"]').forEach(cb=>{
          localStorage.removeItem(cb.id);
          cb.classList.remove('checked');
        });
        localStorage.setItem('lastResetDate', today);
      }
    }
    function restore() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        if (localStorage.getItem(cb.id) === 'true') cb.classList.add('checked');
      });
    }
    function bindCheckboxes() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        cb.addEventListener('click', ()=>{
          const g = cb.dataset.group;
          if (g) {
            const st = !cb.classList.contains('checked');
            document.querySelectorAll(`.checkbox[data-group="${g}"]`)
              .forEach(o=>{ o.classList.toggle('checked', st); localStorage.setItem(o.id, st); });
          } else {
            cb.classList.toggle('checked');
            localStorage.setItem(cb.id, cb.classList.contains('checked'));
          }
        });
      });
    }
    function initToggles() {
      ['alt1','alt2','alt3'].forEach(id=>{
        const sec = document.getElementById(id),
              ct = sec.querySelector('.section-content'),
              btn= sec.querySelector('.toggle-btn'),
              key = 'collapsed_'+id;
        let col = localStorage.getItem(key);
        col = col===null ? true : (col==='true');
        ct.classList.toggle('collapsed', col);
        btn.textContent = col ? '▶' : '▼';
        btn.addEventListener('click', ()=>{
          const nowCollapsed = !ct.classList.toggle('collapsed');
          btn.textContent = nowCollapsed ? '▶' : '▼';
          localStorage.setItem(key, !nowCollapsed);
        });
      });
    }
    window.addEventListener('load', ()=>{
      resetDaily();
      restore();
      bindCheckboxes();
      initToggles();
    });
  </script>
