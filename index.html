<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>모비노기 체크리스트</title>
  <style>
    /* Pretendard 폰트 */
    @import url('https://cdn.jsdelivr.net/npm/pretendard@1.3.6/dist/web/variable/pretendardvariable.css');

    :root {
      --accent-color: #4a90e2;
      --checkbox-size: 20px;
      --section-radius: 8px;
      --section-padding: 16px;
      --text-color: #333;
      --bg-page: #f5f7fa;
      --bg-section: #ffffff;
      --border-light: #e0e0e0;
    }

    body {
      background: var(--bg-page);
      font-family: 'Pretendard Variable', sans-serif;
      color: var(--text-color);
      margin: 0; padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-weight: 600;
      font-size: 1.8rem;
    }

    .section {
      background: var(--bg-section);
      border-radius: var(--section-radius);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin: 20px auto;
      max-width: 800px;
      overflow: hidden;
    }
    .section h2 {
      margin: 0;
      padding: var(--section-padding);
      display: flex; align-items: center;
      font-size: 1.2rem; font-weight: 500;
      background: #fafafa;
      border-bottom: 1px solid var(--border-light);
    }
    .section.main h2   { border-left: 6px solid #e74c3c; }
    .section.alt1 h2   { border-left: 6px solid #3498db; }
    .section.alt2 h2   { border-left: 6px solid #2ecc71; }
    .section.alt3 h2   { border-left: 6px solid #f1c40f; }

    .toggle-btn {
      margin-left: auto;
      background: none; border: none;
      font-size: 1.2rem; cursor: pointer;
      transition: transform 0.2s;
    }
    .toggle-btn:hover { transform: rotate(90deg); }
    .section-content.collapsed { display: none; }
    .section-content { padding: 0 var(--section-padding) var(--section-padding); }

    .subsection h3 {
      margin: var(--section-padding) 0 8px;
      font-size: 1rem; font-weight: 500;
      text-align: center;
    }
    .subsection.daily h3   { color: #d35400; }
    .subsection.weekly h3  { color: #2980b9; }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    tr:nth-child(even) { background: rgba(0,0,0,0.02); }
    td, th {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-light);
      white-space: nowrap;
      vertical-align: middle;
    }
    /* 첫 칸만 볼드 + 들여쓰기, 나머진 중앙정렬 */
    td:first-child {
      font-weight: bold;
      padding-left: 20px;
      text-align: left;
    }
    td:not(:first-child),
    th {
      text-align: center;
    }

    .checkbox {
      width: var(--checkbox-size);
      height: var(--checkbox-size);
      border: 2px solid var(--border-light);
      border-radius: 4px;
      background: #fff;
      display: inline-block;
      position: relative;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-right: 6px;
    }
    .checkbox:hover { border-color: var(--accent-color); }
    .checkbox.checked {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }
    .checkbox.checked::after {
      content: '✔';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px; color: #fff;
    }
    label {
      cursor: pointer; user-select: none;
      font-size: 0.95rem; color: var(--text-color);
    }
    label:hover .checkbox { border-color: var(--accent-color); }
  </style>
</head>
<body>
  <h1>모비노기 체크리스트</h1>

  <!-- 본 섹션 -->
  <div class="section main" id="main-section">
    <h2>본</h2>
    <div class="section-content">
      <div class="subsection daily">
        <h3>일일도전</h3>
        <table>
          <tr>
            <td>무료 패션 리롤</td>
            <td><span class="checkbox" id="main_freeFashion" data-frequency="daily" data-group="freeFashion"></span></td>
          </tr>
          <tr>
            <td>검은 구멍</td>
            <td><span class="checkbox" id="main_blackHole_1" data-frequency="daily"></span></td>
            <td><span class="checkbox" id="main_blackHole_2" data-frequency="daily"></span></td>
            <td><span class="checkbox" id="main_blackHole_3" data-frequency="daily"></span></td>
          </tr>
          <tr>
            <td>결계</td>
            <td><span class="checkbox" id="main_barrier_1" data-frequency="daily"></span></td>
            <td><span class="checkbox" id="main_barrier_2" data-frequency="daily"></span></td>
          </tr>
          <tr>
            <td>요일 던전</td>
            <td><span class="checkbox" id="main_dayDungeon_1" data-frequency="daily"></span></td>
          </tr>
        </table>
      </div>
      <div class="subsection weekly">
        <h3>주간도전</h3>
        <table>
          <tr>
            <td>멤버쉽 골드알바</td>
            <td><span class="checkbox" id="main_goldAlba" data-frequency="weekly"></span></td>
          </tr>
          <tr>
            <td>필보</td>
            <td>
              <label><span class="checkbox" id="main_filbo_ferry" data-frequency="weekly"></span>페리</label>
              <label><span class="checkbox" id="main_filbo_kravbakh" data-frequency="weekly"></span>크라브바흐</label>
              <label><span class="checkbox" id="main_filbo_krama" data-frequency="weekly"></span>크라마</label>
            </td>
          </tr>
          <tr>
            <td>마물퇴치징표</td>
            <td>
              <label><span class="checkbox" id="main_monsterRune" data-frequency="weekly" data-group="monsterRune"></span>룬의 파편</label>
              <label><span class="checkbox" id="main_monsterCatalyst" data-frequency="weekly" data-group="monsterCatalyst"></span>강화 재연소 촉매</label>
            </td>
          </tr>
          <tr>
            <td>어비스</td>
            <td>
              <label><span class="checkbox" id="main_abyss_relic" data-frequency="weekly"></span>유적</label>
              <label><span class="checkbox" id="main_abyss_altar" data-frequency="weekly"></span>제단</label>
              <label><span class="checkbox" id="main_abyss_hall" data-frequency="weekly"></span>전당</label>
            </td>
          </tr>
          <tr>
            <td>레이드</td>
            <td>
              <label><span class="checkbox" id="main_raid_beginner" data-frequency="weekly"></span>입문</label>
              <label><span class="checkbox" id="main_raid_hell" data-frequency="weekly"></span>지옥</label>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>

  <!-- 부1 -->
  <div class="section alt1" id="alt1-section">
    <h2>부 1 <button class="toggle-btn">▼</button></h2>
    <div class="section-content">
      <!-- 본과 동일 구조 반복 -->
      <!-- ... -->
    </div>
  </div>

  <!-- 부2 -->
  <div class="section alt2" id="alt2-section">
    <h2>부 2 <button class="toggle-btn">▼</button></h2>
    <div class="section-content">
      <!-- 본과 동일 구조 반복 -->
      <!-- ... -->
    </div>
  </div>

  <!-- 부3 -->
  <div class="section alt3" id="alt3-section">
    <h2>부 3 <button class="toggle-btn">▼</button></h2>
    <div class="section-content">
      <!-- 본과 동일 구조 반복 -->
      <!-- ... -->
    </div>
  </div>

  <script>
    function getCycleDate() {
      const now = new Date();
      if (now.getHours() < 6) now.setDate(now.getDate() - 1);
      return now.toISOString().slice(0,10);
    }
    function resetDaily() {
      const last = localStorage.getItem('lastResetDate');
      const today = getCycleDate();
      if (last !== today) {
        document.querySelectorAll('.checkbox[data-frequency="daily"]').forEach(cb=>{
          localStorage.removeItem(cb.id);
          cb.classList.remove('checked');
        });
        localStorage.setItem('lastResetDate', today);
      }
    }
    function restore() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        if (localStorage.getItem(cb.id) === 'true') {
          cb.classList.add('checked');
        }
      });
    }
    function bindCheckboxes() {
      document.querySelectorAll('.checkbox').forEach(cb=>{
        cb.addEventListener('click', () => {
          const group = cb.dataset.group;
          if (group) {
            const newState = !cb.classList.contains('checked');
            document.querySelectorAll(`.checkbox[data-group="${group}"]`)
              .forEach(other => {
                other.classList.toggle('checked', newState);
                localStorage.setItem(other.id, newState);
              });
          } else {
            cb.classList.toggle('checked');
            localStorage.setItem(cb.id, cb.classList.contains('checked'));
          }
        });
      });
    }
    function bindToggles() {
      document.querySelectorAll('.toggle-btn').forEach(btn=>{
        btn.addEventListener('click', () => {
          const content = btn.closest('.section').querySelector('.section-content');
          const collapsed = content.classList.toggle('collapsed');
          btn.textContent = collapsed ? '▶' : '▼';
        });
      });
    }
    window.addEventListener('load', () => {
      resetDaily();
      restore();
      bindCheckboxes();
      bindToggles();
    });
  </script>
</body>
</html>
